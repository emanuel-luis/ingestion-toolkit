version: 1
source:
  name: erp
  source_type: rdbms
  connection_id: erp
  database: erp
  schema_name: sales
extract:
  table: orders
  primary_key:
    - id
  pattern: fullscan
  columns:
    - name: id
      type: integer
      nullable: false
    - name: customer_id
      type: integer
      nullable: true
    - name: product_id
      type: integer
      nullable: true
    - name: quantity
      type: integer
      nullable: true
    - name: total
      type: numeric
      nullable: true
    - name: order_date
      type: date
      nullable: true
load:
  connection_id: warehouse
  target_schema: bronze
  target_table: erp__orders
  write_mode: overwrite
  max_reject_ratio: 0.01
landing:
  root: /opt/airflow/data/landing
schedule:
  cron: '@daily'
  start_date: 2026-01-01
  retries: 3
  retry_delay_minutes: 5
  tags: []
metadata:
  owner: data-engineering
