version: 1
source:
  name: erp
  source_type: rdbms
  connection_id: erp
  database: erp
  schema_name: sales
extract:
  table: products
  primary_key:
    - id
  pattern: cdc
  columns:
    - name: id
      type: integer
      nullable: false
    - name: name
      type: text
      nullable: true
    - name: category
      type: text
      nullable: true
    - name: price
      type: numeric
      nullable: true
    - name: version_stamp
      type: integer
      nullable: false
  cdc:
    mechanism: generic
    sequence_column: version_stamp
    sequence_type: integer
    delete_values:
      - D
load:
  connection_id: warehouse
  target_schema: bronze
  target_table: erp__products
  write_mode: merge
  merge_keys:
    - id
  max_reject_ratio: 0.0
landing:
  root: /opt/airflow/data/landing
schedule:
  cron: '@daily'
  start_date: 2026-01-01
  retries: 3
  retry_delay_minutes: 5
  tags: []
metadata:
  owner: data-engineering
