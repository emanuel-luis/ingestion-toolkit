[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "ingestion-toolkit"
version = "0.1.0"
description = "CLI that writes validated ingestion configs (YAML/JSON) for relational sources."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emanuel Luis" }]
keywords = ["data-engineering", "ingestion", "cli", "etl", "airflow", "config"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Environment :: Console",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.27",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
]

[project.scripts]
ingest = "ingestion_toolkit.cli.main:app"

[project.urls]
Homepage = "https://github.com/emanuel-luis/ingestion-toolkit"
Repository = "https://github.com/emanuel-luis/ingestion-toolkit"
Issues = "https://github.com/emanuel-luis/ingestion-toolkit/issues"
Changelog = "https://github.com/emanuel-luis/ingestion-toolkit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-timeout>=2.4",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["BLE"]

[tool.ruff.lint.per-file-ignores]
# rendered DAGs keep long SQL lines and a long header comment, and use timezone.utc so they
# also run on Python 3.10 (datetime.UTC is 3.11+)
"tests/golden/*.py" = ["E501", "UP017"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
timeout = 60
markers = ["slow: property tests that render many configs (run with -m slow)"]
